<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer radar/sonar rings representing vision assistance -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="10"/>

  <!-- Assistive Eye Silhouette -->
  <path d="M120 256C160 180 205 140 256 140C307 140 352 180 392 256C352 332 307 372 256 372C205 372 160 332 120 256Z" 
        fill="none" stroke="url(#amberGlow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Vision Iris & Audio Wave Dot -->
  <circle cx="256" cy="256" r="54" fill="url(#amberGlow)"/>
  <circle cx="256" cy="256" r="24" fill="#0b172a"/>
  
  <!-- White Cane / Forward Path Ray -->
  <line x1="256" y1="375" x2="256" y2="435" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="445" r="8" fill="#38bdf8"/>
</svg>
